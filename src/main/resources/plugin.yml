name: FloatingChat
version: '${project.version}'
main: com.floatingchat.plugin.FloatingChatPlugin
api-version: '1.21'
author: FloatingChat
description: Chat melayang di atas/samping/depan/belakang karakter pemain, terlihat oleh pemain lain (Java & Bedrock via Geyser).
folia-supported: false

commands:
  floatingchat:
    description: Perintah utama plugin FloatingChat
    usage: /floatingchat reload
    aliases: [fchat, fc]
    permission: floatingchat.admin

permissions:
  floatingchat.admin:
    description: Izin untuk reload & mengatur plugin FloatingChat
    default: op
  floatingchat.use:
    description: Izin agar chat pemain ditampilkan sebagai floating chat
    default: true
  floatingchat.bypasscensor:
    description: Izin agar chat pemain tidak disensor
    default: op
